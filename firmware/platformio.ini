; PixelLoop firmware — ESP-IDF 5.5 built through PlatformIO (pioarduino platform).
;
; One [env:<board>] per supported board. The app that goes into the image is
; selected with the CMake variable PIXELLOOP_APP (see src/CMakeLists.txt);
; PlatformIO does not allow build_src_filter for ESP-IDF projects.
;
;   pio run -e probe -t upload      # board identification firmware
;   pio run -e ws169 -t upload      # PixelLoop OS for the Waveshare 1.69" board
;
; Prefer the Makefile in the repo root: it picks the port, serialises access
; to the device and stores logs/screenshots under artifacts/.

[platformio]
default_envs = probe

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = espidf
; ESP32-S3 with 16 MB quad flash + 8 MB octal PSRAM (the module on every
; Waveshare ESP32-S3-Touch-LCD board). Flash/PSRAM mode live in sdkconfig.defaults.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DPIXELLOOP_VERSION=\"0.1.0\"

; ---------------------------------------------------------------------------
; Board identification: reports chip/flash/PSRAM and scans every I2C pin pair
; Waveshare uses, so tools/probe.py can tell which board is attached.
[env:probe]
board_build.cmake_extra_args = -DPIXELLOOP_APP=probe -DPIXELLOOP_BOARD=generic
