name: build
# Compiles every firmware env on a clean runner and runs the golden tests
# against the desktop simulator. Hardware-in-the-loop tests need the device
# and run locally (`make test`).
on:
  push:
    branches: [main]
  pull_request:
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [probe, ws169]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
            ~/.platformio/penv
            ~/.platformio/dist
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        # 6.2 pins SCons 4.11 while the pioarduino platform pins 4.8.1; the two
        # reinstall each other mid-run and the link step fails (AGENTS.md).
        run: pip install "platformio>=6.1.18,<6.2"
      - name: Build ${{ matrix.env }}
        working-directory: firmware
        run: pio run -e ${{ matrix.env }}
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.env }}
          path: |
            firmware/.pio/build/${{ matrix.env }}/firmware.bin
            firmware/.pio/build/${{ matrix.env }}/bootloader.bin
            firmware/.pio/build/${{ matrix.env }}/partitions.bin
          if-no-files-found: error

  simulator:
    # The OS UI on the host: same sources, LVGL + SDL2 rendering offscreen.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SDL2, Ninja and uv
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev ninja-build
          pipx install uv
      - name: Build the simulator
        run: make sim-build
      - name: Golden tests against the simulator
        env:
          SDL_VIDEODRIVER: offscreen
        run: make sim-test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simulator-screenshots
          path: artifacts/sim
          if-no-files-found: error
